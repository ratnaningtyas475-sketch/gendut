<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gim Edukasi IPS Kelas 9 - Sang Ekonom Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            width: 95%;
            max-width: 900px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            position: relative;
            padding: 40px 30px;
            margin: 20px 0;
        }

        h1, h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Start Screen */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group label {
            font-weight: 600;
            font-size: 1rem;
            color: #475569;
        }

        .input-group input {
            padding: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .btn {
            background: #f59e0b; /* Amber / Gold */
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 6px rgba(245, 158, 11, 0.3);
        }

        .btn:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        /* Quiz Screen */
        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #f59e0b;
            width: 0%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 25px;
            line-height: 1.7;
            text-align: justify;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            text-align: left;
            line-height: 1.5;
            color: #334155;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .option-letter {
            font-weight: 800;
            background: #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 35px;
            text-align: center;
        }

        .option:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option.correct-reveal {
            background: #ecfdf5;
            border-color: #10b981;
            color: #065f46;
        }
        .option.correct-reveal .option-letter {
            background: #10b981;
            color: white;
        }

        .option.wrong-reveal {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }
        .option.wrong-reveal .option-letter {
            background: #ef4444;
            color: white;
        }

        #next-btn {
            background: #0ea5e9; /* Light Blue */
            box-shadow: 0 4px 6px rgba(14, 165, 233, 0.3);
            display: none;
            margin: 0;
            max-width: 100%;
        }
        #next-btn:hover {
            background: #0284c7;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
        }

        .score-display {
            font-size: 5rem;
            font-weight: 800;
            color: #f59e0b;
            margin: 10px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .btn-download {
            background: #10b981;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
            margin-top: 20px;
        }

        .btn-download:hover {
            background: #059669;
        }

        /* Custom Modal (Replaces Alert) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-box p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #1e293b;
        }
        .modal-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        canvas {
            display: none;
        }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            .header-quiz { flex-direction: column; gap: 10px; align-items: flex-start; }
            .option { padding: 12px; font-size: 0.95rem; }
            .score-display { font-size: 4rem; }
        }
    </style>
</head>
<body>

<!-- Custom Modal -->
<div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
        <p id="modal-text">Pesan di sini</p>
        <button class="modal-btn" onclick="closeModal()">Mengerti</button>
    </div>
</div>

<div class="container">
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <h1>📈 Sang Ekonom Digital 🌍</h1>
        <p style="text-align: center; margin-bottom: 30px; color: #64748b; font-size: 1.1rem;">
            Tantangan Evaluasi 50 Soal HOTS IPS Kelas 9<br>
            (Ekonomi Digital, Literasi Finansial & Interaksi Abad 21)
        </p>
        <div class="input-group">
            <label for="player-name">Nama Peserta Didik:</label>
            <input type="text" id="player-name" placeholder="Masukkan nama lengkapmu..." autocomplete="off">
        </div>
        <button class="btn" onclick="startGame()">Mulai Evaluasi</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="header-quiz">
            <span id="question-tracker">Soal 1 / 50</span>
            <span id="player-display" style="background:#f1f5f9; padding:5px 12px; border-radius:20px;"></span>
        </div>
        <div id="question-text" class="question-text">Teks Soal</div>
        <div id="options-container" class="options">
            <!-- Options injected by JS -->
        </div>
        <button id="next-btn" class="btn" onclick="nextQuestion()">Selanjutnya</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <div class="result-container">
            <h2>Evaluasi Selesai, <span id="final-name" style="color: #0ea5e9;"></span>! 🎉</h2>
            <p style="color: #64748b; margin-top: 10px;">Kemampuan Analisis & Evaluasi (HOTS C5) kamu menghasilkan skor:</p>
            <div class="score-display" id="final-score">0</div>
            <p style="margin-bottom: 30px; color: #475569;" id="feedback-text"></p>
            
            <button class="btn btn-download" onclick="downloadCertificate()">Unduh Sertifikat 🏆</button>
            <button class="btn" style="margin-top: 15px; background: #64748b;" onclick="location.reload()">Ulangi Gim</button>
        </div>
    </div>
</div>

<canvas id="cert-canvas" width="1000" height="700"></canvas>

<script>
    // --- 50 HOTS C5 (EVALUASI) QUESTIONS ---
    const questions = [
        // TEMA 1: PERKEMBANGAN EKONOMI DIGITAL (1-10)
        {
            q: "Pemerintah menetapkan kebijakan pajak bagi e-commerce asing yang beroperasi di Indonesia. Sebuah UMKM lokal mengeluh karena bahan baku impor yang biasa mereka beli via platform tersebut menjadi lebih mahal. Sebagai ekonom, evaluasi mana yang paling tepat terhadap kebijakan pemerintah tersebut?",
            options: [
                "Kebijakan tersebut gagal karena justru mematikan UMKM lokal yang bergantung pada bahan baku impor murah.",
                "Kebijakan tersebut tepat secara makro untuk menciptakan kesetaraan (level playing field) antara produk asing dan lokal, meski UMKM perlu adaptasi mencari substitusi bahan baku lokal.",
                "Pajak e-commerce asing sebaiknya dihapus sama sekali agar konsumen diuntungkan dengan harga yang sangat murah.",
                "Pemerintah seharusnya hanya memungut pajak dari pembeli, bukan dari platform e-commerce asing tersebut."
            ],
            answer: 1
        },
        {
            q: "Tren 'Gig Economy' (pekerja lepas seperti ojek online atau freelancer) berkembang pesat di era digital. Jika dievaluasi dari sisi perlindungan tenaga kerja jangka panjang, kelemahan paling fundamental dari sistem ini adalah...",
            options: [
                "Fleksibilitas waktu yang tinggi membuat pekerja menjadi malas berinovasi.",
                "Tidak adanya jaminan sosial yang mengikat (seperti asuransi kesehatan/pensiun dari perusahaan) yang memindahkan risiko sepenuhnya ke individu.",
                "Pendapatan yang diperoleh terlalu besar sehingga memicu inflasi di tingkat daerah.",
                "Pekerja tidak diwajibkan membayar pajak sehingga merugikan kas negara secara langsung."
            ],
            answer: 1
        },
        {
            q: "Banyak startup lokal yang melakukan 'bakar uang' (promo besar-besaran) untuk meraih pengguna, namun akhirnya bangkrut. Evaluasi kegagalan model bisnis ini menunjukkan bahwa...",
            options: [
                "Masyarakat Indonesia belum siap dengan teknologi digital dan masih menyukai transaksi konvensional.",
                "Loyalitas konsumen yang didapat dari diskon bersifat semu, sehingga ketika harga kembali normal, bisnis kehilangan pendapatan untuk bertahan.",
                "Pemerintah terlalu banyak ikut campur dalam mengatur regulasi startup lokal.",
                "Sistem keamanan aplikasi startup lokal sangat lemah sehingga mudah diretas oleh pesaing."
            ],
            answer: 1
        },
        {
            q: "Di era ekonomi digital, data pribadi pengguna dianggap sebagai 'The New Oil'. Sebuah aplikasi gratis meminta akses ke galeri dan kontak Anda padahal aplikasi tersebut hanya berupa kalkulator. Evaluasi risiko dari situasi ini adalah...",
            options: [
                "Aplikasi akan bekerja lebih cepat karena terhubung dengan seluruh data di ponsel cerdas.",
                "Potensi komersialisasi data tanpa izin (pelanggaran privasi) yang bisa berujung pada penipuan atau profiling target iklan secara ilegal.",
                "Aplikasi tersebut sebenarnya adalah virus yang akan merusak perangkat keras (hardware) ponsel Anda.",
                "Tidak ada risiko berarti karena data kontak dan galeri tidak memiliki nilai ekonomi di pasar digital."
            ],
            answer: 1
        },
        {
            q: "Otomatisasi dan AI (Kecerdasan Buatan) perlahan menggantikan pekerjaan kasir dan customer service. Dari sudut pandang pembangunan ekonomi berkelanjutan, langkah evaluasi paling strategis yang harus diambil oleh pemerintah adalah...",
            options: [
                "Melarang sama sekali penggunaan AI di perusahaan untuk melindungi lapangan kerja manusia.",
                "Membiarkan seleksi alam terjadi, di mana manusia yang tidak bisa AI akan tersingkir dengan sendirinya.",
                "Mereformasi kurikulum pendidikan vokasi untuk melakukan 'upskilling' agar tenaga kerja memiliki keahlian analisis dan kreatif yang tidak bisa digantikan AI.",
                "Memberikan subsidi uang tunai seumur hidup kepada seluruh pekerja yang digantikan oleh mesin otomatis."
            ],
            answer: 2
        },
        {
            q: "Munculnya 'Content Creator' menjadi profesi baru yang menjanjikan secara finansial. Namun, banyak kreator yang membuat konten kontroversial (prank berbahaya) demi 'views'. Evaluasi dampak fenomena ini terhadap struktur sosial-ekonomi masyarakat adalah...",
            options: [
                "Meningkatkan perputaran ekonomi secara signifikan tanpa memberikan dampak negatif pada moralitas sosial.",
                "Menciptakan ekonomi yang tidak etis, di mana metrik keuntungan (adSense) mendisrupsi norma sosial dan berpotensi menurunkan kualitas literasi penonton.",
                "Fenomena wajar karena dalam ekonomi kapitalis, semua hal boleh dilakukan selama menghasilkan uang dan disukai audiens.",
                "Kreator konten tersebut harus dijadikan duta budaya karena berhasil memanfaatkan peluang ekonomi digital dengan maksimal."
            ],
            answer: 1
        },
        {
            q: "Adanya 'Digital Divide' (Kesenjangan Digital) antara desa dan kota menyebabkan program digitalisasi ekonomi UMKM di pedesaan sering mandek. Berdasarkan analisis, apa intervensi paling tepat untuk menyelesaikan akar masalah ini?",
            options: [
                "Membagikan ribuan smartphone gratis setiap tahun ke penduduk desa.",
                "Memaksa UMKM desa untuk pindah ke kota agar mendapat sinyal yang bagus.",
                "Membangun infrastruktur jaringan internet (BTS) yang merata, dibarengi dengan program pendampingan literasi digital intensif bagi warga.",
                "Menghentikan program digitalisasi di desa dan membiarkan mereka menggunakan sistem barter tradisional."
            ],
            answer: 2
        },
        {
            q: "Perusahaan Big Tech sering dituduh melakukan monopoli dengan membeli perusahaan rintisan (startup) kecil yang berpotensi menjadi pesaing mereka. Mengapa praktik ini dievaluasi sangat berbahaya bagi iklim ekonomi digital?",
            options: [
                "Mematikan inovasi karena mencegah munculnya kompetitor baru yang bisa memberikan harga lebih murah dan layanan lebih baik bagi konsumen.",
                "Menguntungkan pemerintah karena hanya perlu memantau satu atau dua perusahaan besar saja untuk urusan pajak.",
                "Menjadikan aplikasi lebih sedikit di app store sehingga konsumen tidak kebingungan memilih.",
                "Membuat perusahaan kecil merasa dihargai karena dibeli dengan harga yang sangat mahal oleh perusahaan besar."
            ],
            answer: 0
        },
        {
            q: "Sebuah desa wisata mempromosikan destinasinya 100% menggunakan media sosial dan menerima pemesanan hanya via platform asing. Setelah dianalisis, risiko ekonomi terbesar dari ketergantungan ini adalah...",
            options: [
                "Desa akan menjadi sangat terkenal di seluruh dunia dalam waktu satu malam.",
                "Jika algoritma platform berubah atau platform diblokir, aliran pendapatan desa wisata tersebut bisa terhenti seketika.",
                "Turis lokal tidak akan mau datang karena mengira biayanya menggunakan mata uang asing.",
                "Pemerintah daerah tidak akan bisa memungut retribusi kebersihan dari desa wisata tersebut."
            ],
            answer: 1
        },
        {
            q: "Pemanfaatan Cloud Computing (komputasi awan) membuat biaya operasional bisnis digital menjadi sangat murah dibandingkan menyewa server fisik. Namun, evaluasi kelemahan utama dari sistem ini bagi kedaulatan data suatu negara adalah...",
            options: [
                "Data menjadi lebih berat untuk diunduh karena tersimpan di awan.",
                "Data warga negara berisiko disimpan di server luar negeri yang tidak tunduk pada hukum negara asal jika terjadi kebocoran (data breach).",
                "Cloud computing memakan kuota internet yang terlalu besar dari pengguna aplikasi lokal.",
                "Server awan sangat mudah hancur jika terjadi perubahan cuaca atau badai matahari."
            ],
            answer: 1
        },

        // TEMA 2: UANG DAN LEMBAGA KEUANGAN (11-20)
        {
            q: "Saat terjadi inflasi yang tinggi (harga barang melonjak tajam), Bank Sentral (BI) memutuskan untuk menaikkan suku bunga acuan. Evaluasi bagaimana kebijakan ini diharapkan dapat menyelamatkan perekonomian!",
            options: [
                "Suku bunga tinggi membuat orang malas menabung dan memilih membelanjakan uangnya, sehingga pabrik cepat kaya.",
                "Suku bunga kredit menjadi mahal, masyarakat mengurangi pinjaman dan konsumsi, sehingga jumlah uang beredar turun dan harga barang kembali stabil.",
                "Pemerintah dapat mencetak uang lebih banyak untuk menutupi harga barang yang naik.",
                "Bank akan memberikan bunga yang sangat rendah agar masyarakat miskin bisa meminjam uang untuk membeli sembako."
            ],
            answer: 1
        },
        {
            q: "Andi memiliki opsi meminjam modal usaha dari Bank Umum (dengan syarat agunan yang ketat) atau dari Pinjol Ilegal (tanpa syarat tapi bunga 5% per hari). Jika Andi memilih Pinjol dengan alasan kecepatan, evaluasi dampak finansial jangka panjangnya!",
            options: [
                "Usaha Andi akan cepat maju karena uangnya langsung cair dalam hitungan menit tanpa repot.",
                "Andi terhindar dari penyitaan aset karena pinjol ilegal tidak meminta agunan rumah.",
                "Andi berpotensi masuk ke dalam 'lingkaran setan' utang akibat akumulasi bunga majemuk tak wajar yang akan menguras seluruh aset dan merusak mentalnya.",
                "Pinjol ilegal akan menghapus utang Andi secara otomatis jika usaha Andi terbukti bangkrut."
            ],
            answer: 2
        },
        {
            q: "Lembaga Penjamin Simpanan (LPS) menjamin uang nasabah di bank maksimal Rp 2 Miliar. Jika seorang nasabah kaya membagi uangnya yang berjumlah Rp 10 Miliar ke 5 bank yang berbeda (masing-masing Rp 2 Miliar), evaluasi strategi nasabah tersebut!",
            options: [
                "Strategi tersebut ilegal karena mencoba menipu pemerintah dan LPS.",
                "Strategi mitigasi risiko yang sangat cerdas dan legal, sehingga jika kelima bank tersebut bangkrut, seluruh uangnya (10M) tetap dijamin LPS.",
                "Tindakan yang sia-sia karena LPS hanya mengakui nama satu nasabah untuk total keseluruhan bank di Indonesia.",
                "Berisiko tinggi karena membagi uang berarti membagi jumlah keuntungan bunga menjadi lebih sedikit."
            ],
            answer: 1
        },
        {
            q: "Masyarakat saat ini perlahan meninggalkan uang kartal (kertas/logam) dan beralih ke uang elektronik (e-money/QRIS). Evaluasi keuntungan makroekonomi bagi negara dengan adanya 'Cashless Society' ini!",
            options: [
                "Negara menghemat triliunan rupiah dari biaya pencetakan, distribusi, dan pemusnahan uang fisik, serta transaksi ekonomi lebih mudah dilacak untuk pajak.",
                "Memudahkan negara untuk menyadap pembicaraan pribadi warga negara melalui aplikasi perbankan.",
                "Bank Sentral tidak perlu lagi memantau inflasi karena uang elektronik tidak terpengaruh oleh kenaikan harga barang.",
                "Uang elektronik mencegah pencuri untuk mengambil barang di rumah masyarakat."
            ],
            answer: 0
        },
        {
            q: "Banyak generasi muda (Gen Z) lebih memilih menabung dalam bentuk Emas Antam (logam mulia) dibandingkan menaruh uang di rekening bank tabungan biasa. Evaluasi dasar pemikiran finansial yang melatarbelakangi keputusan ini!",
            options: [
                "Emas memiliki bunga bulanan yang jauh lebih besar daripada bank.",
                "Uang di bank terkena biaya administrasi bulanan dan inflasi menggerus nilainya, sedangkan emas berfungsi sebagai 'lindung nilai' (hedge) terhadap inflasi jangka panjang.",
                "Emas sangat mudah digunakan untuk berbelanja kebutuhan sehari-hari di minimarket.",
                "Emas adalah satu-satunya mata uang resmi yang diakui oleh Perserikatan Bangsa-Bangsa."
            ],
            answer: 1
        },
        {
            q: "Koperasi Simpan Pinjam sering kali memberikan pembagian Sisa Hasil Usaha (SHU) di akhir tahun kepada anggotanya, hal yang tidak ada pada Bank Umum. Evaluasi nilai sosial-ekonomi dari sistem koperasi ini!",
            options: [
                "Koperasi memonopoli perputaran uang di suatu daerah.",
                "Menciptakan pemerataan kesejahteraan berdasarkan asas kekeluargaan, di mana keuntungan dikembalikan kepada anggota sesuai kontribusinya, bukan hanya pada pemilik modal.",
                "Sistem yang merugikan karena SHU memotong uang kas koperasi sehingga koperasi mudah bangkrut.",
                "Koperasi memaksa anggotanya untuk selalu berutang agar SHU yang didapat lebih besar."
            ],
            answer: 1
        },
        {
            q: "Otoritas Jasa Keuangan (OJK) memiliki fungsi krusial dalam mengawasi industri jasa keuangan. Jika suatu negara tidak memiliki lembaga seperti OJK, apa evaluasi risiko sistemik terbesarnya?",
            options: [
                "Bunga bank akan turun drastis karena tidak ada yang memungut pajak.",
                "Masyarakat akan dengan mudah meminjam uang tanpa batas dari negara asing.",
                "Terjadinya 'shadow banking' (bank gelap), penipuan investasi bodong, dan kebangkrutan bank massal tanpa peringatan dini yang akan menghancurkan kepercayaan publik.",
                "Pemerintah daerah bebas mencetak mata uang sendiri untuk menyejahterakan rakyatnya."
            ],
            answer: 2

                "Menyimpan uang tunai di 5 lemari pakaian yang berbeda di dalam rumah."
            ],
            answer: 2
        },
        {
            q: "Banyak pekerja muda mengalami 'Gaji numpang lewat' setiap awal bulan akibat utang cicilan yang menumpuk. Evaluasi rasio batas aman Debt-to-Income (Rasio Utang terhadap Pendapatan) yang direkomendasikan para perencana keuangan!",
            options: [
                "Utang maksimal 70% dari gaji agar bisa memiliki banyak barang mewah saat masih muda.",
                "Utang maksimal 10% dari gaji, selebihnya harus ditabung di bawah bantal.",
                "Beban cicilan utang maksimal tidak boleh lebih dari 30% pendapatan bulanan, agar arus kas (cash flow) tetap sehat untuk hidup dan investasi.",
                "Tidak ada batas maksimal utang, selama pinjol masih mau memberikan pinjaman."
            ],
            answer: 2
        },
        {
            q: "Apa evaluasi paling komprehensif mengenai perbedaan mendasar antara 'Menabung' (Saving) dan 'Berinvestasi' (Investing) di era modern?",
            options: [
                "Menabung berarti mengamankan uang pokok demi likuiditas jangka pendek dan darurat (tergerus inflasi), sementara Investasi menumbuhkan uang untuk mengalahkan inflasi jangka menengah-panjang dengan mengambil sejumlah risiko.",
                "Menabung dilakukan di bank syariah, investasi dilakukan di bank konvensional.",
                "Menabung khusus untuk anak-anak sekolah, investasi wajib untuk orang dewasa.",
                "Tidak ada bedanya, keduanya sama-sama membuat orang cepat menjadi miliarder."
            ],
            answer: 0
        },
        {
            q: "Farel berusia 25 tahun, memiliki gaji UMR, belum menikah, namun sudah memikirkan Dana Pensiun (Retirement Plan). Teman-temannya menganggap Farel berlebihan. Evaluasi tindakan Farel tersebut secara logis!",
            options: [
                "Tindakan Farel memang konyol, dana pensiun baru pantas dipikirkan saat usia 50 tahun ke atas.",
                "Farel sangat cerdas memanfaatkan 'Time Horizon' panjang. Menabung pensiun sejak UMR dengan nominal kecil akan lebih ringan dan hasilnya eksponensial di hari tua dibanding baru mulai menabung besar di usia 45 tahun.",
                "Farel sebaiknya keluar dari pekerjaannya dan meminta uang pensiun dini dari perusahaan.",
                "Farel harus memberikan seluruh gajinya kepada orang tua sebagai bentuk dana pensiun tradisi."
            ],
            answer: 1
        }
    ];

    // --- GAME LOGIC ---
    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let hasAnswered = false;
    let playerName = "";

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const questionTracker = document.getElementById("question-tracker");
    const playerDisplay = document.getElementById("player-display");
    const nameInput = document.getElementById("player-name");
    const progressBar = document.getElementById("progress-bar");

    // Modal Control
    function showModal(msg) {
        document.getElementById('modal-text').innerText = msg;
        document.getElementById('custom-modal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('custom-modal').style.display = 'none';
    }

    function startGame() {
        const name = nameInput.value.trim();
        if(name === "") {
            showModal("Mohon masukkan nama kamu terlebih dahulu sebelum memulai evaluasi!");
            return;
        }
        playerName = name;
        playerDisplay.textContent = "👤 " + playerName;
        
        startScreen.classList.remove("active");
        quizScreen.classList.add("active");
        
        showQuestion();
    }

    function updateProgress() {
        const percent = ((currentQuestionIndex) / questions.length) * 100;
        progressBar.style.width = percent + "%";
    }

    function showQuestion() {
        hasAnswered = false;
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";
        updateProgress();
        
        const qData = questions[currentQuestionIndex];
        questionTracker.textContent = `Kasus ${currentQuestionIndex + 1} / ${questions.length}`;
        questionText.textContent = qData.q;

        const letters = ['A', 'B', 'C', 'D'];

        qData.options.forEach((opt, index) => {
            const btn = document.createElement("div");
            btn.classList.add("option");
            
            // Letter Box
            const letterSpan = document.createElement("span");
            letterSpan.classList.add("option-letter");
            letterSpan.textContent = letters[index];
            
            // Text Content
            const textSpan = document.createElement("span");
            textSpan.textContent = opt;

            btn.appendChild(letterSpan);
            btn.appendChild(textSpan);

            btn.onclick = () => selectAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, btnElement) {
        if(hasAnswered) return;
        hasAnswered = true;

        const qData = questions[currentQuestionIndex];
        const allOptions = optionsContainer.querySelectorAll(".option");

        if(selectedIndex === qData.answer) {
            btnElement.classList.add("correct-reveal");
            correctAnswersCount++;
        } else {
            btnElement.classList.add("wrong-reveal");
            // Show correct answer to student
            allOptions[qData.answer].classList.add("correct-reveal");
        }

        // Disable clicks on all options
        allOptions.forEach(opt => opt.style.cursor = "default");

        nextBtn.style.display = "block";
        if(currentQuestionIndex === questions.length - 1) {
            nextBtn.textContent = "Akhiri & Lihat Hasil Evaluasi";
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if(currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        quizScreen.classList.remove("active");
        resultScreen.classList.add("active");

        const score = Math.round((correctAnswersCount / questions.length) * 100);

        document.getElementById("final-name").textContent = playerName;
        document.getElementById("final-score").textContent = score;

        let feedback = "";
        if(score >= 85) feedback = "Luar Biasa! Kemampuan analisis ekonomimu sangat tajam dan setara dengan praktisi keuangan.";
        else if(score >= 70) feedback = "Bagus! Kamu sudah memahami konsep dasar interaksi ekonomi digital dengan baik.";
        else if(score >= 50) feedback = "Cukup baik. Namun kamu perlu meningkatkan literasi finansial dan analisis strategismu.";
        else feedback = "Jangan menyerah! Terus pelajari fenomena ekonomi digital agar kamu tidak tertinggal di abad 21.";

        document.getElementById("feedback-text").textContent = feedback;
        
        // Save score to window object for certificate generator
        window.finalScore = score;
    }

    function downloadCertificate() {
        const canvas = document.getElementById("cert-canvas");
        const ctx = canvas.getContext("2d");

        // Background Color
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Aesthetic Borders / Background Patterns
        // Top polygon
        ctx.fillStyle = "#0f2027";
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(canvas.width, 0); ctx.lineTo(canvas.width, 150); ctx.lineTo(0, 50);
        ctx.fill();

        // Bottom polygon
        ctx.fillStyle = "#f59e0b"; // Gold
        ctx.beginPath();
        ctx.moveTo(0, canvas.height); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(canvas.width, canvas.height - 100); ctx.lineTo(0, canvas.height - 50);
        ctx.fill();

        // Inner Border
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#cbd5e1";
        ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

        // Text configurations
        ctx.textAlign = "center";
        
        ctx.font = "bold 50px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#1e293b";
        ctx.fillText("SERTIFIKAT LITERASI FINANSIAL", canvas.width / 2, 220);

        ctx.font = "24px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#64748b";
        ctx.fillText("Menyatakan dengan bangga bahwa:", canvas.width / 2, 280);

        // Player Name
        ctx.font = "bold 55px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#0ea5e9";
        ctx.fillText(playerName.toUpperCase(), canvas.width / 2, 360);
        
        // Underline
        const textWidth = ctx.measureText(playerName.toUpperCase()).width;
        ctx.beginPath();
        ctx.moveTo((canvas.width / 2) - (textWidth / 2) - 30, 375);
        ctx.lineTo((canvas.width / 2) + (textWidth / 2) + 30, 375);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#f59e0b";
        ctx.stroke();

        ctx.font = "22px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#475569";
        ctx.fillText("Telah menyelesaikan Evaluasi HOTS (C5) Mata Pelajaran IPS Kelas 9", canvas.width / 2, 440);
        
        ctx.font = "bold 26px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#1e293b";
        ctx.fillText("Materi: Ekonomi Digital, Lembaga Keuangan & Interaksi Abad 21", canvas.width / 2, 480);

        // Score Ribbon logic
        ctx.fillStyle = "#10b981"; // Emerald Green
        ctx.beginPath();
        ctx.roundRect((canvas.width/2) - 150, 520, 300, 60, 10);
        ctx.fill();

        ctx.font = "bold 32px 'Plus Jakarta Sans', Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("SKOR AKHIR: " + window.finalScore, canvas.width / 2, 560);

        // Date
        ctx.font = "italic 18px Arial";
        ctx.fillStyle = "#94a3b8";
        const dateObj = new Date();
        const optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
        ctx.fillText("Tanggal Terbit: " + dateObj.toLocaleDateString("id-ID", optionsDate), canvas.width / 2, 620);

        // Trigger Download
        const link = document.createElement("a");
        link.download = `Sertifikat_IPS_${playerName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // Allow Enter key in input field
    nameInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            startGame();
        }
    });
</script>
</body>
